apiVersion: v1
kind: ServiceAccount
metadata:
  name: dmh-deployer
  labels:
    app.kubernetes.io/part-of: data-manager-hub
    dmh.io/managed-by: platform-rbac
# The protected ARC runner must authenticate to the Kubernetes API as this
# namespace-local identity. It is never used by application Pods; the runner
# is isolated by GitHub Environment/runner-group protection and the Role below.
automountServiceAccountToken: true
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dmh-runtime
  labels:
    app.kubernetes.io/part-of: data-manager-hub
    dmh.io/managed-by: platform-rbac
automountServiceAccountToken: false
