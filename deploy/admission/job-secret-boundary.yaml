apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: data-manager-hub-private-job-boundary
spec:
  failurePolicy: Fail
  matchConstraints:
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: In
          values: [dmh-dev, dmh-staging, dmh-prod]
    resourceRules:
      - apiGroups: [batch]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [jobs]
  validations:
    - expression: >-
        object.spec.template.spec.serviceAccountName == 'dmh-runtime'
      message: private data-manager-hub Jobs must use dmh-runtime
    - expression: >-
        has(object.spec.template.spec.automountServiceAccountToken) &&
        object.spec.template.spec.automountServiceAccountToken == false
      message: private data-manager-hub Jobs must disable service-account token automount
    - expression: >-
        has(object.spec.backoffLimit) && object.spec.backoffLimit == 0
      message: private data-manager-hub Jobs must set backoffLimit to zero
    - expression: >-
        object.spec.template.spec.containers.all(c,
        has(c.image) &&
        c.image.matches('^ghcr.io/lixud/data-manager-hub-(dbops|acceptance)@sha256:[0-9a-f]{64}$'))
      message: private data-manager-hub Jobs must use digest-qualified dbops or acceptance images
    - expression: >-
        object.spec.template.spec.containers.size() == 1 &&
        (!has(object.spec.template.spec.initContainers) || object.spec.template.spec.initContainers.size() == 0)
      message: private data-manager-hub Jobs must contain exactly one trusted application container
    - expression: >-
        object.spec.template.spec.containers.all(c, !has(c.command))
      message: private data-manager-hub Jobs must use the image entrypoint
    - expression: >-
        object.spec.template.spec.containers.all(c,
        (c.image.matches('^ghcr.io/lixud/data-manager-hub-dbops@sha256:[0-9a-f]{64}$') &&
         (!has(c.args) || c.args.all(a, a in ['migrate', 'preflight', 'status', 'update-sql', 'nacos']))) ||
        (c.image.matches('^ghcr.io/lixud/data-manager-hub-acceptance@sha256:[0-9a-f]{64}$') &&
         (!has(c.args) || c.args.size() == 0)))
      message: private data-manager-hub Jobs may use only the entrypoint allowed for their image
    - expression: >-
        has(object.spec.template.spec.securityContext) &&
        object.spec.template.spec.securityContext.runAsNonRoot == true &&
        object.spec.template.spec.securityContext.runAsUser == 10001 &&
        object.spec.template.spec.securityContext.runAsGroup == 10001 &&
        has(object.spec.template.spec.securityContext.seccompProfile) &&
        object.spec.template.spec.securityContext.seccompProfile.type == 'RuntimeDefault'
      message: private data-manager-hub Jobs must use the fixed non-root runtime identity
    - expression: >-
        object.spec.template.spec.containers.all(c,
        has(c.securityContext) &&
        c.securityContext.allowPrivilegeEscalation == false &&
        has(c.securityContext.capabilities) &&
        c.securityContext.capabilities.drop.exists(cap, cap == 'ALL') &&
        ((c.image.matches('^ghcr.io/lixud/data-manager-hub-acceptance@sha256:[0-9a-f]{64}$') &&
          c.securityContext.readOnlyRootFilesystem == false) ||
         (!c.image.matches('^ghcr.io/lixud/data-manager-hub-acceptance@sha256:[0-9a-f]{64}$') &&
          c.securityContext.readOnlyRootFilesystem == true)))
      message: private data-manager-hub Jobs must use the constrained container security profile
    - expression: >-
        has(object.spec.template.spec.imagePullSecrets) &&
        object.spec.template.spec.imagePullSecrets.size() == 1 &&
        object.spec.template.spec.imagePullSecrets.all(s, s.name == 'dmh-ghcr-pull')
      message: private data-manager-hub Jobs may use only dmh-ghcr-pull for image pulls
    - expression: >-
        has(object.spec.template.spec.volumes) &&
        object.spec.template.spec.volumes.size() == 3 &&
        object.spec.template.spec.volumes.all(v,
        v.name in ['tmp', 'workspace-target', 'runtime'] &&
        has(v.emptyDir) && !has(v.secret) && !has(v.configMap) &&
        !has(v.projected) && !has(v.downwardAPI) && !has(v.persistentVolumeClaim) &&
        !has(v.hostPath) && !has(v.csi))
      message: private data-manager-hub Jobs may use only the three release-scoped emptyDir volumes
    - expression: >-
        object.spec.template.spec.containers.all(c,
        has(c.volumeMounts) && c.volumeMounts.size() == 3 &&
        c.volumeMounts.all(m,
        (m.name == 'tmp' && m.mountPath == '/tmp') ||
        (m.name == 'workspace-target' && m.mountPath == '/workspace/target') ||
        (m.name == 'runtime' && m.mountPath == '/workspace/.runtime')))
      message: private data-manager-hub Jobs may mount only the release workspace paths
    - expression: >-
        object.spec.template.spec.containers.all(c,
        !has(c.envFrom) || c.envFrom.all(e,
        has(e.secretRef) && e.secretRef.name in ['dmh-runtime', 'dmh-acceptance']))
      message: private data-manager-hub Jobs may inject only runtime and acceptance Secrets
    - expression: >-
        object.spec.template.spec.containers.all(c,
        (c.image.matches('^ghcr.io/lixud/data-manager-hub-dbops@sha256:[0-9a-f]{64}$') &&
         has(c.envFrom) && c.envFrom.size() == 1 &&
         c.envFrom.all(e, has(e.secretRef) && e.secretRef.name == 'dmh-runtime')) ||
        (c.image.matches('^ghcr.io/lixud/data-manager-hub-acceptance@sha256:[0-9a-f]{64}$') &&
         has(c.envFrom) && c.envFrom.size() == 2 &&
         c.envFrom.all(e, has(e.secretRef) && e.secretRef.name in ['dmh-runtime', 'dmh-acceptance']) &&
         c.envFrom.exists(e, e.secretRef.name == 'dmh-runtime') &&
         c.envFrom.exists(e, e.secretRef.name == 'dmh-acceptance')))
      message: private data-manager-hub Jobs must use the Secret set assigned to their image
    - expression: >-
        object.spec.template.spec.containers.all(c,
        !has(c.env) || c.env.all(e,
        !has(e.valueFrom) &&
        e.name in ['NACOS_PROFILE', 'NACOS_NAMESPACE', 'NACOS_GROUP', 'NACOS_MODE']))
      message: private data-manager-hub Jobs may set only the Nacos release-control environment keys
    - expression: >-
        (!has(object.spec.template.spec.initContainers) ||
        object.spec.template.spec.initContainers.all(c,
        (!has(c.envFrom) || c.envFrom.all(e,
        has(e.secretRef) && e.secretRef.name in ['dmh-runtime', 'dmh-acceptance'])) &&
        (!has(c.env) || c.env.all(e,
        !has(e.valueFrom) &&
        e.name in ['NACOS_PROFILE', 'NACOS_NAMESPACE', 'NACOS_GROUP', 'NACOS_MODE']))))
      message: private data-manager-hub initContainers may set only release-control environment keys
    - expression: >-
        (!has(object.spec.template.spec.volumes) ||
        object.spec.template.spec.volumes.all(v,
        !has(v.secret) || v.secret.secretName in ['dmh-runtime', 'dmh-acceptance']))
      message: private data-manager-hub Jobs may mount only runtime and acceptance Secrets
    - expression: >-
        (!has(object.spec.template.spec.volumes) ||
        object.spec.template.spec.volumes.all(v,
        !has(v.projected) || v.projected.sources.all(s,
        !has(s.secret) || s.secret.name in ['dmh-runtime', 'dmh-acceptance'])))
      message: private data-manager-hub projected volumes may reference only runtime and acceptance Secrets
    - expression: >-
        (!has(object.spec.template.spec.volumes) ||
        object.spec.template.spec.volumes.all(v,
        !has(v.projected) || v.projected.sources.all(s, !has(s.serviceAccountToken))))
      message: private data-manager-hub Jobs may not project ServiceAccount tokens
    - expression: >-
        (!has(object.spec.template.spec.volumes) ||
        object.spec.template.spec.volumes.all(v, !has(v.hostPath) && !has(v.csi)))
      message: private data-manager-hub Jobs may not use hostPath or CSI secret volumes
    - expression: >-
        (!has(object.spec.template.spec.hostNetwork) || object.spec.template.spec.hostNetwork == false) &&
        (!has(object.spec.template.spec.hostPID) || object.spec.template.spec.hostPID == false) &&
        (!has(object.spec.template.spec.hostIPC) || object.spec.template.spec.hostIPC == false)
      message: private data-manager-hub Jobs may not use host namespaces
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: data-manager-hub-private-job-boundary
spec:
  policyName: data-manager-hub-private-job-boundary
  validationActions: [Deny]
