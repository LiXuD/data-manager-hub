{{- if not (lookup "v1" "ServiceAccount" .Release.Namespace .Values.global.serviceAccount) }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.global.serviceAccount }}
  labels:
    {{- include "dmh.labels" . | nindent 4 }}
  # The platform RBAC overlay pre-creates this identity. Keep it if a local
  # install ever had to create it before the overlay was applied.
  annotations:
    helm.sh/resource-policy: keep
# The protected deployment Runner authenticates as dmh-deployer. Workload
# Pods use the separate dmh-runtime account below and explicitly disable token
# automounting.
automountServiceAccountToken: true
{{- end }}
{{- if not (lookup "v1" "ServiceAccount" .Release.Namespace .Values.global.workloadServiceAccount) }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.global.workloadServiceAccount }}
  labels:
    {{- include "dmh.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
automountServiceAccountToken: false
{{- end }}
