name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '21'
  NODE_VERSION: '22.19.0'
  NPM_VERSION: '10.9.3'

jobs:
  classify:
    name: classify changes
    runs-on: ubuntu-24.04
    outputs:
      backend: ${{ steps.classify.outputs.backend }}
      frontend: ${{ steps.classify.outputs.frontend }}
      migration: ${{ steps.classify.outputs.migration }}
      security: ${{ steps.classify.outputs.security }}
      deployability: ${{ steps.classify.outputs.deployability }}
      plugin: ${{ steps.classify.outputs.plugin }}
      external_plugin: ${{ steps.classify.outputs.external_plugin }}
      full: ${{ steps.classify.outputs.full }}
      source_change: ${{ steps.classify.outputs.source_change }}
      base_ref: ${{ steps.classify.outputs.base_ref }}
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: classify
        name: Classify changed paths
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
          CLASSIFICATION_FILE: classification.env
        run: bash ci/scripts/classify-changes.sh
      - name: Upload immutable change classification
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ci-classification-${{ github.run_id }}
          path: classification.env
          if-no-files-found: error

  meta:
    name: CI / meta
    needs: classify
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ci/requirements.txt
      - name: Install validation dependencies
        run: python -m pip install --requirement ci/requirements.txt
      - name: Validate runtime contract
        run: |
          python ci/scripts/verify-contracts.py
          python ci/scripts/check-workflow-matrices.py
          python ci/scripts/verify-rbac.py
          python ci/scripts/verify-admission-policy.py
      - name: Validate Prometheus release rules
        run: |
          python ci/scripts/verify-observability-rules.py
          python ci/scripts/verify-release-gates-policy.py
      - name: Validate toolchain lock
        run: python ci/scripts/verify-toolchain-lock.py
      - name: Validate Dockerfile policy
        run: python ci/scripts/check-dockerfiles.py
      - name: Exercise CI contract scripts
        run: python -m unittest discover -s ci/tests -p 'test_*.py'
      - name: Validate action pinning
        run: python ci/scripts/check-actions-pinned.py
      - name: Validate workflow YAML and inline shell
        run: python ci/scripts/check-workflows.py
      - name: Validate Markdown links and anchors
        run: python ci/scripts/check-markdown-links.py
      - name: Validate workflows with locked actionlint
        run: >-
          docker run --rm
          -v "$GITHUB_WORKSPACE":/repo
          -w /repo
          rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
          -config-file .github/actionlint.yaml
      - name: Validate Prometheus rules with locked promtool
        run: >-
          docker run --rm
          -v "$GITHUB_WORKSPACE":/repo
          -w /repo
          --entrypoint promtool
          prom/prometheus@sha256:497fe921f22fea8535fa2bcb1c193dacc6ce98c08274257b3d18a4eaae0f9647
          check rules observability/prometheus-rules.yaml
      - name: Validate protected policy files
        env:
          BASE_REF: ${{ needs.classify.outputs.base_ref }}
        run: |
          python ci/scripts/verify-policy-files.py \
            --base-ref "$BASE_REF" \
            --waiver ci/policy/coverage-waivers.yaml \
            --waiver ci/policy/security-waivers.yaml
          python ci/scripts/verify-ghcr-retention.py
      - name: Validate migration immutability
        env:
          BASE_REF: ${{ needs.classify.outputs.base_ref }}
        run: bash ci/scripts/check-migration-immutability.sh

  backend:
    name: CI / backend
    needs: classify
    if: needs.classify.outputs.backend == 'true' || needs.classify.outputs.full == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Java
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - name: Verify Maven build and tests
        run: ./mvnw -B -ntp verify
      - name: Enforce backend coverage ratchet
        env:
          BASE_REF: ${{ needs.classify.outputs.base_ref }}
        run: python3 ci/scripts/check-coverage.py --scope backend --enforce-changed-baseline --base-ref "$BASE_REF"
      - name: Architecture boundaries
        run: bash arch-scan.sh
      - name: Upload backend evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: backend-evidence-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            **/target/surefire-reports/**
            **/target/failsafe-reports/**
            **/target/site/jacoco/**

  frontend:
    name: CI / frontend
    needs: classify
    if: needs.classify.outputs.frontend == 'true' || needs.classify.outputs.full == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: data-platform-web
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: data-platform-web/package-lock.json
      - name: Install locked dependencies
        run: |
          test "$(node --version)" = "v${NODE_VERSION}"
          test "$(npm --version)" = "${NPM_VERSION}"
          npm ci
      - name: Lint
        run: npm run lint
      - name: Test with coverage
        run: npm run test:coverage
      - name: Enforce coverage ratchet
        working-directory: .
        env:
          BASE_REF: ${{ needs.classify.outputs.base_ref }}
        run: python3 ci/scripts/check-coverage.py --scope frontend --enforce-changed-baseline --base-ref "$BASE_REF"
      - name: Build production Web
        run: npm run build
      - name: Upload frontend evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: frontend-evidence-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            data-platform-web/coverage/**
            data-platform-web/dist/**

  migration:
    name: CI / migration
    needs: classify
    if: needs.classify.outputs.migration == 'true' || needs.classify.outputs.full == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
        env:
          POSTGRES_DB: dataplatform_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dataplatform_ci"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Java
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - name: Check numbering and immutable history
        env:
          BASE_REF: ${{ needs.classify.outputs.base_ref }}
        run: bash ci/scripts/check-migration-immutability.sh
      - name: Validate and exercise strict migration
        env:
          MAVEN_BIN: ./mvnw
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_NAME: dataplatform_ci
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
        run: |
          bash ci/scripts/strict-migration.sh preflight
          bash ci/scripts/strict-migration.sh update
          bash ci/scripts/strict-migration.sh update
          bash ci/scripts/strict-migration.sh status
      - name: Run connector migration regression matrices
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          bash verify-v048-routing.sh
          bash verify-v049-connector-product-spec.sh
          bash verify-v050-generic-http.sh

  security:
    name: CI / security
    needs: classify
    if: needs.classify.outputs.security == 'true' || needs.classify.outputs.plugin == 'true' || needs.classify.outputs.full == 'true'
    runs-on: ubuntu-24.04
    # Dependabot pull_request jobs intentionally do not receive repository
    # secrets.  They must still run the NVD scan, but use the public endpoint
    # without a key; trusted and scheduled jobs remain fail-closed on the key.
    env:
      ALLOW_UNKEYED_NVD: ${{ github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]' }}
    permissions:
      contents: read
      security-events: write
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Setup Java
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - name: Cache OWASP Dependency-Check NVD database
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: dependency-check-nvd-${{ runner.os }}
      - name: Setup Node for npm audit
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: data-platform-web/package-lock.json
      - name: npm high-severity audit
        working-directory: data-platform-web
        run: |
          test "$(node --version)" = "v${NODE_VERSION}"
          test "$(npm --version)" = "${NPM_VERSION}"
          npm ci --ignore-scripts
          npm audit --audit-level=high --json > npm-audit.json
      - name: Verify NVD API credential
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: bash ci/scripts/verify-nvd-api.sh
      - id: dependency_scan
        name: Dependency, SBOM and license reports
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: ./mvnw -B -ntp -Pconnector-supply-chain-scan -DnvdMaxRetryCount=3 -DskipTests verify
      - name: Save OWASP Dependency-Check NVD database
        if: steps.dependency_scan.outcome == 'success'
        continue-on-error: true
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: dependency-check-nvd-${{ runner.os }}
      - name: Upload supply-chain reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: supply-chain-evidence-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            data-platform-web/npm-audit.json
            **/target/dependency-check-report.*
            **/target/bom.json
            **/target/generated-sources/license/**
      - name: CodeQL initialize
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938
        with:
          languages: java,javascript-typescript
      - name: CodeQL autobuild
        run: ./mvnw -B -V -DskipTests package
      - name: CodeQL analyze
        uses: github/codeql-action/analyze@60168efe1c415ce0f5521ea06d5c2062adbeed1b
        with:
          category: /language:all
      - name: Secret pattern guard
        run: |
          if git grep -n -I -E '(BEGIN (RSA|OPENSSH|EC) PRIVATE KEY|AKIA[0-9A-Z]{16}|gh[pousr]_[A-Za-z0-9]{30,})' -- ':!*.md'; then
            echo 'possible credential found in tracked source' >&2
            exit 2
          fi

  deployability:
    name: CI / deployability
    needs: classify
    if: needs.classify.outputs.deployability == 'true' || needs.classify.outputs.full == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install validation dependencies
        run: python -m pip install --requirement ci/requirements.txt
      - name: Setup Helm
        uses: azure/setup-helm@b9e51907a09c216f16ebe8536097933489208112
        with:
          version: 3.19.0
      - name: Validate runtime contract
        run: python ci/scripts/verify-contracts.py
      - name: Validate Dockerfile policy
        run: python ci/scripts/check-dockerfiles.py
      - name: Lint and render Helm for every environment
        run: |
          for env in dev staging prod; do
            source_sha=0000000000000000000000000000000000000000
            group_prefix=DEV
            [[ "$env" == staging ]] && group_prefix=STAGING
            [[ "$env" == prod ]] && group_prefix=PROD
            helm lint deploy/helm/data-manager-hub \
              --namespace "dmh-${env}" \
              -f "deploy/helm/data-manager-hub/values-${env}.yaml" \
              --set-string "global.nacosGroup=DMH_${group_prefix}_${source_sha}"
            helm template data-manager-hub deploy/helm/data-manager-hub \
              --namespace "dmh-${env}" \
              -f "deploy/helm/data-manager-hub/values-${env}.yaml" \
              --set-string "global.nacosGroup=DMH_${group_prefix}_${source_sha}" \
              > "rendered-${env}.yaml"
            python ci/scripts/check-helm-policy.py "rendered-${env}.yaml"
          done
      - name: Validate workflow action pinning
        run: python ci/scripts/check-actions-pinned.py

  docker:
    name: CI / docker
    needs: classify
    if: needs.classify.outputs.deployability == 'true' || needs.classify.outputs.full == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: gateway
            dockerfile: docker/java-service.Dockerfile
            build_args: MODULE=data-platform-gateway
          - component: masterdata
            dockerfile: docker/java-service.Dockerfile
            build_args: MODULE=data-platform-masterdata/data-platform-masterdata-service
          - component: access
            dockerfile: docker/java-service.Dockerfile
            build_args: MODULE=data-platform-access/data-platform-access-service
          - component: billing
            dockerfile: docker/java-service.Dockerfile
            build_args: MODULE=data-platform-billing/data-platform-billing-service
          - component: identity
            dockerfile: docker/java-service.Dockerfile
            build_args: MODULE=data-platform-identity/data-platform-identity-service
          - component: governance
            dockerfile: docker/java-service.Dockerfile
            build_args: MODULE=data-platform-governance/data-platform-governance-service
          - component: web
            dockerfile: docker/web.Dockerfile
            build_args: ''
          - component: dbops
            dockerfile: docker/dbops.Dockerfile
            build_args: ''
          - component: acceptance
            dockerfile: docker/acceptance.Dockerfile
            build_args: ''
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e
      - name: Setup Python for base-image policy
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install base-image policy dependencies
        run: python3 -m pip install --requirement ci/requirements.txt
      - name: Verify locked base image platforms
        run: python3 ci/scripts/check-base-image-platforms.py
      - name: Build release image without push
        env:
          COMPONENT: ${{ matrix.component }}
          DOCKERFILE: ${{ matrix.dockerfile }}
          BUILD_ARGS: ${{ matrix.build_args }}
        run: |
          set -euo pipefail
          args=()
          [[ -z "$BUILD_ARGS" ]] || args+=(--build-arg "$BUILD_ARGS")
          docker buildx build \
            --platform linux/amd64 \
            --file "$DOCKERFILE" \
            --tag "dmh-ci-${COMPONENT}:${GITHUB_SHA}" \
            --load \
            --provenance=false \
            --sbom=false \
            "${args[@]}" \
            .
          docker image inspect "dmh-ci-${COMPONENT}:${GITHUB_SHA}" >/dev/null
      - name: Smoke test Web runtime
        if: matrix.component == 'web'
        env:
          IMAGE: dmh-ci-web:${{ github.sha }}
        run: |
          set -euo pipefail
          container="$(docker run -d --platform linux/amd64 --read-only \
            --tmpfs /var/cache/nginx --tmpfs /var/run --tmpfs /tmp \
            -p 127.0.0.1::8080 "$IMAGE")"
          cleanup() { docker rm -f "$container" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          port=''
          health=''
          for _ in $(seq 1 30); do
            port="$(docker port "$container" 8080/tcp | sed -n 's/.*:\([0-9][0-9]*\)$/\1/p')"
            if [[ -n "$port" ]] && health="$(curl -fsS "http://127.0.0.1:$port/healthz" 2>/dev/null)"; then
              break
            fi
            sleep 1
          done
          test "$health" = ok
          curl -fsS "http://127.0.0.1:$port/" | grep -q '<!DOCTYPE html>'
      - name: Smoke test acceptance offline dependency closure
        if: matrix.component == 'acceptance'
        env:
          IMAGE: dmh-ci-acceptance:${{ github.sha }}
        run: |
          set -euo pipefail
          # This intentionally skips Failsafe because the CI runner has no
          # deployed Gateway or test account.  The protected deploy Job uses
          # the same image entrypoint without -DskipITs and must run the real
          # login/data assertions in staging or production.
          docker run --rm --platform linux/amd64 --network none --tmpfs /tmp \
            --entrypoint mvn "$IMAGE" \
            -B -ntp -o -pl data-platform-test/data-platform-test-service -am \
            -Dintegration.tests=true -Dacceptance.skip.unit.tests=true -DskipITs=true verify

  required-ci:
    name: CI / required-ci
    needs: [classify, meta, backend, frontend, migration, security, deployability, docker]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Evaluate required job conclusions
        env:
          CLASSIFY: ${{ needs.classify.result }}
          META: ${{ needs.meta.result }}
          BACKEND: ${{ needs.backend.result }}
          FRONTEND: ${{ needs.frontend.result }}
          MIGRATION: ${{ needs.migration.result }}
          SECURITY: ${{ needs.security.result }}
          DEPLOYABILITY: ${{ needs.deployability.result }}
          DOCKER: ${{ needs.docker.result }}
          BACKEND_NEEDED: ${{ needs.classify.outputs.backend }}
          FRONTEND_NEEDED: ${{ needs.classify.outputs.frontend }}
          MIGRATION_NEEDED: ${{ needs.classify.outputs.migration }}
          SECURITY_NEEDED: ${{ needs.classify.outputs.security }}
          DEPLOYABILITY_NEEDED: ${{ needs.classify.outputs.deployability }}
          DOCKER_NEEDED: ${{ needs.classify.outputs.deployability }}
          SOURCE_CHANGE: ${{ needs.classify.outputs.source_change }}
        run: |
          set -euo pipefail
          for pair in "classify:$CLASSIFY" "meta:$META"; do
            result=${pair#*:}
            [[ "$result" == success ]] || { echo "$pair" >&2; exit 2; }
          done
          check_needed() {
            local name="$1" needed="$2" result="$3"
            if [[ "$needed" == true && "$result" != success ]]; then
              echo "$name required but result=$result" >&2
              exit 2
            fi
            if [[ "$needed" != true && "$result" != success && "$result" != skipped ]]; then
              echo "$name unexpectedly ended with result=$result" >&2
              exit 2
            fi
          }
          check_needed backend "$BACKEND_NEEDED" "$BACKEND"
          check_needed frontend "$FRONTEND_NEEDED" "$FRONTEND"
          check_needed migration "$MIGRATION_NEEDED" "$MIGRATION"
          check_needed security "$SECURITY_NEEDED" "$SECURITY"
          check_needed deployability "$DEPLOYABILITY_NEEDED" "$DEPLOYABILITY"
          check_needed docker "$DOCKER_NEEDED" "$DOCKER"
          if [[ "$SOURCE_CHANGE" == true && "$BACKEND_NEEDED" != true && "$FRONTEND_NEEDED" != true && "$MIGRATION_NEEDED" != true && "$SECURITY_NEEDED" != true && "$DEPLOYABILITY_NEEDED" != true ]]; then
            echo 'source changes cannot mark every substantive gate not-applicable' >&2
            exit 2
          fi
          if [[ "$SOURCE_CHANGE" == true && "$DEPLOYABILITY" != success ]]; then
            echo 'source changes must always produce a successful deployability result' >&2
            exit 2
          fi
          echo 'required CI passed'
