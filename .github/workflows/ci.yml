name: CI

on:
  pull_request:
    branches: [dev, master]
  push:
    branches: [dev, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '21'
  NODE_VERSION: '22.19.0'

jobs:
  backend:
    name: CI / backend
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Java
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - name: Verify master security sync and development CI boundary
        run: python3 ci/scripts/verify-dev-security-sync.py
      - name: Install CI contract dependencies
        run: python3 -m pip install --requirement ci/requirements.txt
      - name: Exercise repository contract scripts
        run: python3 -m unittest discover -s ci/tests -p 'test_*.py'
      - name: Compile and run backend tests
        run: >-
          ./mvnw -B -ntp verify
          -pl '!data-platform-test/data-platform-test-api,!data-platform-test/data-platform-test-service,!data-platform-test/test-fixtures/external-connector-plugin'

  frontend:
    name: CI / frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: data-platform-web
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: data-platform-web/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Lint frontend
        run: npm run lint
      - name: Run frontend tests
        run: npm test
      - name: Compile frontend
        run: npm run build

  required-ci:
    name: CI / required-ci
    needs: [backend, frontend]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Require compile and test jobs to pass
        env:
          BACKEND: ${{ needs.backend.result }}
          FRONTEND: ${{ needs.frontend.result }}
        run: |
          set -euo pipefail
          [[ "$BACKEND" == success ]] || { echo "backend result=$BACKEND" >&2; exit 2; }
          [[ "$FRONTEND" == success ]] || { echo "frontend result=$FRONTEND" >&2; exit 2; }
          echo 'required CI passed'
