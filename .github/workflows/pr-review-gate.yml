name: PR Review Gate

on:
  pull_request:
    branches: [dev, master]
    paths-ignore:
      - '**.md'
      - 'docs/**'

concurrency:
  group: pr-gate-${{ github.head_ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'            # 匹配根 pom java 21
          cache: maven
      - name: Build & test (exclude integration module)
        # data-platform-test 是集成测试（需运行中的 Gateway + 微服务 + 中间件），
        # 整体排除出 PR 门禁；其质量由 nightly-integration.yml 保障。
        run: mvn -B -ntp -T 1C verify -pl '!data-platform-test'
      - name: Upload JaCoCo report (phase 1, report only)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: '**/target/site/jacoco/'
      - name: Upload Checkstyle & SpotBugs reports (phase 1, report only)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: static-analysis-reports
          path: |
            **/target/checkstyle-result.xml
            **/target/spotbugsXml.xml

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: data-platform-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'            # 匹配 package.json engines ^20.19/^22.13/>=24
          cache: npm
          cache-dependency-path: data-platform-web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build              # 含 vue-tsc 全量类型检查

  review:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: success()
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # 自动代码审查（报告模式，阶段 1 不 fail）。
      # W2 TODO：选定并验证 review action（coderabbit / github ai-inference 在私有仓库需付费、
      #          大 diff 易超时/超账单）。硬门禁当前只认 backend/frontend 的机器判定项。
      - name: AI review (report only, phase 1)
        run: echo "AI review placeholder — see 代码审查实施计划.md W2"
        # uses: <verified-review-action>@vX
        # with:
        #   fail-on-red: false
