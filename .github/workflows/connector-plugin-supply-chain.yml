name: Connector plugin supply-chain scan

on:
  pull_request:
    paths:
      - 'data-platform-plugin-spi/**'
      - 'data-platform-common-runtime/**'
      - 'data-platform-access/**'
      - 'data-platform-masterdata/**'
      - 'pom.xml'
      - '.github/workflows/connector-plugin-supply-chain.yml'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  connector-supply-chain:
    runs-on: ubuntu-latest
    # A cold NVD database can require more than 45 minutes when the public
    # endpoint throttles requests; keep the gate bounded but allow a full
    # refresh to finish and persist its cache.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Cache OWASP Dependency-Check NVD database
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: dependency-check-nvd-${{ runner.os }}
      - name: Vulnerability, SBOM and license scan
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: >-
          mvn -B -ntp -Pconnector-supply-chain-scan
          -DskipTests -DskipTests=true verify
      - name: Upload reproducible reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: connector-supply-chain-reports
          path: |
            **/target/dependency-check-report.*
            **/target/bom.json
            **/target/site/aggregate-third-party-report.html
          if-no-files-found: warn
