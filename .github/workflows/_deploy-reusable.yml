name: deploy reusable

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      runner_label:
        required: true
        type: string
      manifest_digest:
        required: true
        type: string
      source_sha:
        required: true
        type: string
      release_version:
        required: false
        type: string
        default: ''
      snapshot_receipt_path:
        required: false
        type: string
        default: ''
      snapshot_not_before:
        description: ISO-8601 timestamp of the successful staging deployment; production snapshots must be newer
        required: false
        type: string
        default: ''
      release_gate_samples_path:
        required: false
        type: string
        default: ''
    secrets:
      DMH_PRODUCTION_DB_INSTANCE:
        required: false
      DMH_SNAPSHOT_ADAPTER_BIN:
        required: false
      DMH_SNAPSHOT_SIGNATURE_VERIFIER:
        required: false
      DMH_PROMETHEUS_URL:
        required: false
      DMH_PROMETHEUS_BEARER_TOKEN:
        required: false

permissions:
  contents: read
  packages: read
  attestations: read
  deployments: write

jobs:
  deploy:
    name: deploy ${{ inputs.environment }}
    runs-on: [self-hosted, "${{ inputs.runner_label }}"]
    environment: ${{ inputs.environment }}
    concurrency:
      group: dmh-${{ inputs.environment }}
      cancel-in-progress: false
    env:
      DEPLOY_NAMESPACE: dmh-${{ inputs.environment == 'production' && 'prod' || inputs.environment }}
      # Keep Helm release history in namespace ConfigMaps.  The runner only
      # gets named Secret reads for preflight; it never receives a namespace-
      # wide Secret list/read permission.
      HELM_DRIVER: configmap
    steps:
      - name: Validate immutable workflow inputs
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          RUNNER_LABEL: ${{ inputs.runner_label }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          MANIFEST_DIGEST: ${{ inputs.manifest_digest }}
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo 'source_sha must be a 40-character lowercase commit SHA' >&2
            exit 2
          }
          [[ "$MANIFEST_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || {
            echo 'manifest_digest must be sha256:<64 lowercase hex>' >&2
            exit 2
          }
          case "$ENVIRONMENT" in
            dev|staging)
              [[ "$RUNNER_LABEL" == nonprod-deploy ]] || {
                echo 'dev/staging may use only the nonprod-deploy Runner Group' >&2
                exit 2
              }
              [[ -z "$RELEASE_VERSION" ]] || {
                echo 'release_version is only valid for production' >&2
                exit 2
              }
              ;;
            production)
              [[ "$RUNNER_LABEL" == prod-deploy ]] || {
                echo 'production may use only the prod-deploy Runner Group' >&2
                exit 2
              }
              [[ "$RELEASE_VERSION" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || {
                echo 'production requires an immutable SemVer release_version' >&2
                exit 2
              }
              ;;
            *)
              echo "unsupported deployment environment: $ENVIRONMENT" >&2
              exit 2
              ;;
          esac
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - name: Confirm checkout is the requested commit
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - name: Validate runner tools
        run: |
          set -euo pipefail
          command -v kubectl >/dev/null
          command -v helm >/dev/null
          command -v oras >/dev/null
          command -v jq >/dev/null
          command -v gh >/dev/null
          command -v python3 >/dev/null
          python3 -c 'import yaml' >/dev/null
          python3 - <<'PY'
          import json
          import subprocess
          from pathlib import Path
          import yaml

          lock = yaml.safe_load(Path("ci/toolchain.lock.yaml").read_text(encoding="utf-8"))
          expected_helm = str(lock["helm"]["version"])
          expected_kubectl = str(lock["kubectl"]["version"])
          helm = subprocess.check_output(
              ["helm", "version", "--template", "{{.Version}}"], text=True
          ).strip().lstrip("v")
          kubectl = json.loads(
              subprocess.check_output(
                  ["kubectl", "version", "--client=true", "-o", "json"], text=True
              )
          )["clientVersion"]["gitVersion"].lstrip("v")
          if helm != expected_helm or kubectl != expected_kubectl:
              raise SystemExit(
                  f"runner toolchain mismatch: helm={helm} (expected {expected_helm}), "
                  f"kubectl={kubectl} (expected {expected_kubectl})"
              )
          print(f"runner toolchain verified: helm={helm} kubectl={kubectl}")
          PY
      - name: Preflight namespace, Secret references and Runner RBAC
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          NAMESPACE: ${{ env.DEPLOY_NAMESPACE }}
        run: bash ci/scripts/preflight-cluster.sh
      - name: Validate release-gate policy before deployment
        run: python3 ci/scripts/verify-release-gates-policy.py
      - name: Login to GHCR
        env:
          REGISTRY: ghcr.io
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | oras login "$REGISTRY" --username "$GHCR_USER" --password-stdin
      - name: Fetch and verify Build Manifest
        env:
          MANIFEST_REF: ghcr.io/lixud/data-manager-hub-build-manifest@${{ inputs.manifest_digest }}
        run: |
          set -euo pipefail
          test "${MANIFEST_REF##*@}" = "${{ inputs.manifest_digest }}"
          rm -rf release-manifest
          mkdir -p release-manifest
          oras pull "$MANIFEST_REF" -o release-manifest
          test -s release-manifest/build-manifest.v1.json
          descriptor_json="$(oras manifest fetch --descriptor "$MANIFEST_REF")"
          test "$(jq -r '.digest' <<< "$descriptor_json")" = "${{ inputs.manifest_digest }}"
          oci_layer_digest="$(oras manifest fetch "$MANIFEST_REF" | jq -er '.layers | select(length == 1) | .[0].digest')"
          canonical_layer_digest="$(python3 - <<'PY'
          import hashlib
          from pathlib import Path
          print('sha256:' + hashlib.sha256(Path('release-manifest/build-manifest.v1.json').read_bytes()).hexdigest())
          PY
          )"
          test "$oci_layer_digest" = "$canonical_layer_digest"
          python3 ci/scripts/manifest.py verify \
            --require-required-ci \
            --manifest release-manifest/build-manifest.v1.json
          test "$(jq -r '.metadata.gitSha' release-manifest/build-manifest.v1.json)" = "${{ inputs.source_sha }}"
          expected_source="$(jq -r '.spec.sourceTreeDigest' release-manifest/build-manifest.v1.json)"
          expected_toolchain="$(jq -r '.spec.toolchainLockDigest' release-manifest/build-manifest.v1.json)"
          expected_changelog="$(jq -r '.spec.changelogDigest' release-manifest/build-manifest.v1.json)"
          expected_nacos="$(jq -r '.spec.nacosSourceBundleDigest' release-manifest/build-manifest.v1.json)"
          test "$expected_source" = "$(python3 ci/scripts/hash-tree.py --git-tracked .)"
          test "$expected_toolchain" = "$(python3 ci/scripts/hash-tree.py ci/toolchain.lock.yaml)"
          test "$expected_changelog" = "$(python3 ci/scripts/hash-tree.py sql/changelog)"
          test "$expected_nacos" = "$(python3 ci/scripts/hash-tree.py nacos-config)"
      - name: Verify every image attestation before deployment
        env:
          MANIFEST: release-manifest/build-manifest.v1.json
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          while IFS=$'\t' read -r component reference sbom; do
            echo "verifying attestation for ${component}"
            declared_digest="${reference##*@}"
            actual_digest="$(oras manifest fetch --descriptor "$reference" | jq -er '.digest')"
            test "$actual_digest" = "$declared_digest"
            gh attestation verify "oci://${reference}" -R "$REPOSITORY"
            sbom_ref="${sbom#oci://}"
            sbom_declared_digest="${sbom_ref##*@}"
            sbom_actual_digest="$(oras manifest fetch --descriptor "$sbom_ref" | jq -er '.digest')"
            test "$sbom_actual_digest" = "$sbom_declared_digest"
          done < <(jq -r '.spec.images | to_entries[] | [.key, .value.reference, .value.sbom] | @tsv' "$MANIFEST")
          gh attestation verify "oci://ghcr.io/lixud/data-manager-hub-build-manifest@${{ inputs.manifest_digest }}" -R "$REPOSITORY"
      - name: Create and verify production snapshot receipt
        if: inputs.environment == 'production'
        env:
          RECEIPT_INPUT: ${{ inputs.snapshot_receipt_path }}
          SNAPSHOT_ADAPTER_BIN: ${{ secrets.DMH_SNAPSHOT_ADAPTER_BIN }}
          SNAPSHOT_SIGNATURE_VERIFIER: ${{ secrets.DMH_SNAPSHOT_SIGNATURE_VERIFIER }}
          DB_INSTANCE: ${{ secrets.DMH_PRODUCTION_DB_INSTANCE }}
          SNAPSHOT_NOT_BEFORE: ${{ inputs.snapshot_not_before }}
        run: |
          set -euo pipefail
          changelog_digest="$(jq -r '.spec.changelogDigest' release-manifest/build-manifest.v1.json)"
          schema_version="$(jq -r '.spec.migration.latestVersion' release-manifest/build-manifest.v1.json)"
          test -n "$DB_INSTANCE"
          [[ "$SNAPSHOT_NOT_BEFORE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T ]] || {
            echo 'production requires the successful staging deployment timestamp for snapshot ordering' >&2
            exit 2
          }
          [[ "$SNAPSHOT_SIGNATURE_VERIFIER" = /* && -x "$SNAPSHOT_SIGNATURE_VERIFIER" ]] || {
            echo 'production requires DMH_SNAPSHOT_SIGNATURE_VERIFIER as an executable absolute path' >&2
            exit 2
          }
          if [[ -n "$RECEIPT_INPUT" ]]; then
            test -f "$RECEIPT_INPUT"
            receipt="$RECEIPT_INPUT"
          else
            [[ "$SNAPSHOT_ADAPTER_BIN" = /* && -x "$SNAPSHOT_ADAPTER_BIN" ]] || {
              echo 'production requires DMH_SNAPSHOT_ADAPTER_BIN or an explicitly supplied receipt path' >&2
              exit 2
            }
            receipt="$RUNNER_TEMP/dmh-snapshot-receipt-${GITHUB_RUN_ID}.json"
            bash ci/scripts/create-snapshot-receipt.sh \
              --adapter "$SNAPSHOT_ADAPTER_BIN" \
              --source-instance "$DB_INSTANCE" \
              --schema-version "$schema_version" \
              --changelog-digest "$changelog_digest" \
              --signature-verifier "$SNAPSHOT_SIGNATURE_VERIFIER" \
              --not-before "$SNAPSHOT_NOT_BEFORE" \
              --output "$receipt"
          fi
          python3 ci/scripts/verify-snapshot-receipt.py "$receipt" \
            --source-instance "$DB_INSTANCE" \
            --schema-version "$schema_version" \
            --changelog-digest "$changelog_digest" \
            --not-before "$SNAPSHOT_NOT_BEFORE" \
            --signature-verifier "$SNAPSHOT_SIGNATURE_VERIFIER"
          cp "$receipt" snapshot-receipt.json
          echo "SNAPSHOT_RECEIPT_PATH=$PWD/snapshot-receipt.json" >> "$GITHUB_ENV"
      - name: Plan Nacos bundle offline
        env:
          NAMESPACE: ${{ env.DEPLOY_NAMESPACE }}
          ENVIRONMENT: ${{ inputs.environment }}
          NACOS_GROUP: DMH_${{ inputs.environment == 'production' && 'PROD' || inputs.environment == 'staging' && 'STAGING' || 'DEV' }}_${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          dbops_ref="$(jq -r '.spec.images.dbops.reference' release-manifest/build-manifest.v1.json)"
          job="dmh-nacos-plan-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          profile=prod
          nacos_namespace=prod
          [[ "$ENVIRONMENT" == dev ]] && profile=dev
          [[ "$ENVIRONMENT" == staging ]] && profile=staging
          [[ "$ENVIRONMENT" == dev ]] && nacos_namespace=dev
          [[ "$ENVIRONMENT" == staging ]] && nacos_namespace=staging
          NAMESPACE="$NAMESPACE" JOB="$job" IMAGE="$dbops_ref" bash ci/scripts/create-private-job.sh \
            --env "NACOS_PROFILE=$profile" \
            --env "NACOS_NAMESPACE=$nacos_namespace" \
            --env "NACOS_GROUP=$NACOS_GROUP" \
            --env NACOS_MODE=plan -- nacos
          if ! NAMESPACE="$NAMESPACE" JOB="$job" TIMEOUT_SECONDS=600 bash ci/scripts/wait-for-job.sh; then
            kubectl -n "$NAMESPACE" logs "job/$job" --prefix || true
            exit 2
          fi
          kubectl -n "$NAMESPACE" logs "job/$job" --prefix
          kubectl -n "$NAMESPACE" delete job "$job" --wait=false
      - name: Apply Nacos immutable group
        env:
          NAMESPACE: ${{ env.DEPLOY_NAMESPACE }}
          ENVIRONMENT: ${{ inputs.environment }}
          NACOS_GROUP: DMH_${{ inputs.environment == 'production' && 'PROD' || inputs.environment == 'staging' && 'STAGING' || 'DEV' }}_${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          dbops_ref="$(jq -r '.spec.images.dbops.reference' release-manifest/build-manifest.v1.json)"
          job="dmh-nacos-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          profile=prod
          nacos_namespace=prod
          [[ "$ENVIRONMENT" == dev ]] && profile=dev
          [[ "$ENVIRONMENT" == staging ]] && profile=staging
          [[ "$ENVIRONMENT" == dev ]] && nacos_namespace=dev
          [[ "$ENVIRONMENT" == staging ]] && nacos_namespace=staging
          NAMESPACE="$NAMESPACE" JOB="$job" IMAGE="$dbops_ref" bash ci/scripts/create-private-job.sh \
            --env "NACOS_PROFILE=$profile" \
            --env "NACOS_NAMESPACE=$nacos_namespace" \
            --env "NACOS_GROUP=$NACOS_GROUP" \
            --env NACOS_MODE=apply -- nacos
          if ! NAMESPACE="$NAMESPACE" JOB="$job" TIMEOUT_SECONDS=600 bash ci/scripts/wait-for-job.sh; then
            kubectl -n "$NAMESPACE" logs "job/$job" --prefix || true
            exit 2
          fi
          kubectl -n "$NAMESPACE" logs "job/$job" --prefix
          kubectl -n "$NAMESPACE" delete job "$job" --wait=false
      - name: Verify Nacos immutable group read-only
        env:
          NAMESPACE: ${{ env.DEPLOY_NAMESPACE }}
          ENVIRONMENT: ${{ inputs.environment }}
          NACOS_GROUP: DMH_${{ inputs.environment == 'production' && 'PROD' || inputs.environment == 'staging' && 'STAGING' || 'DEV' }}_${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          dbops_ref="$(jq -r '.spec.images.dbops.reference' release-manifest/build-manifest.v1.json)"
          job="dmh-nacos-verify-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          profile=prod
          nacos_namespace=prod
          [[ "$ENVIRONMENT" == dev ]] && profile=dev
          [[ "$ENVIRONMENT" == staging ]] && profile=staging
          [[ "$ENVIRONMENT" == dev ]] && nacos_namespace=dev
          [[ "$ENVIRONMENT" == staging ]] && nacos_namespace=staging
          NAMESPACE="$NAMESPACE" JOB="$job" IMAGE="$dbops_ref" bash ci/scripts/create-private-job.sh \
            --env "NACOS_PROFILE=$profile" \
            --env "NACOS_NAMESPACE=$nacos_namespace" \
            --env "NACOS_GROUP=$NACOS_GROUP" \
            --env NACOS_MODE=verify -- nacos
          if ! NAMESPACE="$NAMESPACE" JOB="$job" TIMEOUT_SECONDS=600 bash ci/scripts/wait-for-job.sh; then
            kubectl -n "$NAMESPACE" logs "job/$job" --prefix || true
            exit 2
          fi
          kubectl -n "$NAMESPACE" logs "job/$job" --prefix
          kubectl -n "$NAMESPACE" delete job "$job" --wait=false
      - name: Run strict database migration
        env:
          NAMESPACE: ${{ env.DEPLOY_NAMESPACE }}
        run: |
          set -euo pipefail
          mode="$(jq -r '.spec.migration.mode' release-manifest/build-manifest.v1.json)"
          [[ "$mode" == NONE ]] && exit 0
          dbops_ref="$(jq -r '.spec.images.dbops.reference' release-manifest/build-manifest.v1.json)"
          job="dmh-migration-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          NAMESPACE="$NAMESPACE" JOB="$job" IMAGE="$dbops_ref" bash ci/scripts/create-private-job.sh -- migrate
          NAMESPACE="$NAMESPACE" JOB="$job" TIMEOUT_SECONDS=1800 bash ci/scripts/wait-for-job.sh || {
            kubectl -n "$NAMESPACE" logs "job/$job" --prefix
            exit 2
          }
          kubectl -n "$NAMESPACE" logs "job/$job" --prefix
          kubectl -n "$NAMESPACE" delete job "$job" --wait=false
      - name: Capture pre-release SLO baseline
        if: inputs.environment != 'dev'
        env:
          PROMETHEUS_URL: ${{ secrets.DMH_PROMETHEUS_URL }}
          PROMETHEUS_BEARER_TOKEN: ${{ secrets.DMH_PROMETHEUS_BEARER_TOKEN }}
          NAMESPACE: ${{ env.DEPLOY_NAMESPACE }}
        run: |
          set -euo pipefail
          if [[ -n "$PROMETHEUS_URL" ]]; then
            python3 ci/scripts/collect-release-gates.py \
              --url "$PROMETHEUS_URL" \
              --namespace "$NAMESPACE" \
              --environment "${{ inputs.environment }}" \
              --source-sha "${{ inputs.source_sha }}" \
              --manifest-digest "${{ inputs.manifest_digest }}" \
              --synthetic-status not-run \
              --window baseline \
              --output pre-release-gates.json
            echo "RELEASE_GATE_BASELINE=$PWD/pre-release-gates.json" >> "$GITHUB_ENV"
          else
            echo 'DMH_PROMETHEUS_URL is not configured; deployment will require a protected sample file' >&2
          fi
      - name: Upload pre-release SLO baseline
        if: inputs.environment != 'dev' && hashFiles('pre-release-gates.json') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-gate-baseline-${{ inputs.environment }}-${{ github.run_id }}
          path: pre-release-gates.json
          if-no-files-found: error
      - name: Render Helm values from exact manifest digests
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          NAMESPACE: ${{ env.DEPLOY_NAMESPACE }}
        run: |
          set -euo pipefail
          if [[ "$ENVIRONMENT" == production ]]; then
            values=deploy/helm/data-manager-hub/values-prod.yaml
            env_code=PROD
          elif [[ "$ENVIRONMENT" == staging ]]; then
            values=deploy/helm/data-manager-hub/values-staging.yaml
            env_code=STAGING
          else
            values=deploy/helm/data-manager-hub/values-dev.yaml
            env_code=DEV
          fi
          spring_profile=prod
          [[ "$ENVIRONMENT" == dev ]] && spring_profile=dev
          [[ "$ENVIRONMENT" == staging ]] && spring_profile=staging
          args=(--namespace "$NAMESPACE" -f deploy/helm/data-manager-hub/values.yaml -f "$values")
          args+=(--set-string global.environment="$ENVIRONMENT")
          args+=(--set-string global.springProfile="$spring_profile")
          args+=(--set-string global.releaseId="${{ inputs.release_version || inputs.source_sha }}")
          args+=(--set-string global.manifestDigest="${{ inputs.manifest_digest }}")
          args+=(--set-string global.nacosGroup="DMH_${env_code}_${{ inputs.source_sha }}")
          while IFS=$'\t' read -r component reference; do
            repository="${reference%@*}"
            digest="${reference##*@}"
            args+=(--set-string "images.components.${component}.repository=${repository}")
            args+=(--set-string "images.components.${component}.digest=${digest}")
          done < <(jq -r '.spec.images | to_entries[] | [.key, .value.reference] | @tsv' release-manifest/build-manifest.v1.json)
          helm lint deploy/helm/data-manager-hub "${args[@]}"
          helm template data-manager-hub deploy/helm/data-manager-hub "${args[@]}" > rendered.yaml
          python3 ci/scripts/check-helm-policy.py rendered.yaml
          printf '%q ' "${args[@]}" > helm.args
      - name: Helm upgrade without hiding failure state
        env:
          NAMESPACE: ${{ env.DEPLOY_NAMESPACE }}
        run: |
          set -euo pipefail
          previous="$(helm history data-manager-hub -n "$NAMESPACE" -o json 2>/dev/null | jq -r 'map(select(.status == "deployed"))[ -1].revision // empty')"
          echo "previous_revision=${previous:-none}" >> "$GITHUB_ENV"
          echo 'helm_upgrade_started=true' >> "$GITHUB_ENV"
          # shellcheck disable=SC2046
          helm upgrade --install data-manager-hub deploy/helm/data-manager-hub \
            --namespace "$NAMESPACE" \
            $(cat helm.args) --wait --timeout 20m
      - name: Roll Access StatefulSet one Pod at a time
        env:
          NAMESPACE: ${{ env.DEPLOY_NAMESPACE }}
          STATEFULSET: data-manager-hub-access
        run: bash ci/scripts/access-rollout.sh
      - name: Verify live workload image digests
        env:
          NAMESPACE: ${{ env.DEPLOY_NAMESPACE }}
          MANIFEST: release-manifest/build-manifest.v1.json
        run: bash ci/scripts/verify-live-images.sh
      - name: Run acceptance image smoke test
        if: inputs.environment != 'dev'
        env:
          NAMESPACE: ${{ env.DEPLOY_NAMESPACE }}
        run: |
          set -euo pipefail
          acceptance_ref="$(jq -r '.spec.images.acceptance.reference' release-manifest/build-manifest.v1.json)"
          job="dmh-acceptance-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          ENV_SECRETS=dmh-runtime,dmh-acceptance NAMESPACE="$NAMESPACE" JOB="$job" IMAGE="$acceptance_ref" bash ci/scripts/create-private-job.sh
          if ! NAMESPACE="$NAMESPACE" JOB="$job" TIMEOUT_SECONDS=1800 bash ci/scripts/wait-for-job.sh; then
            kubectl -n "$NAMESPACE" logs "job/$job" --prefix || true
            exit 2
          fi
          kubectl -n "$NAMESPACE" logs "job/$job" --prefix
          kubectl -n "$NAMESPACE" delete job "$job" --wait=false
      - name: Run release smoke gates
        if: inputs.environment != 'dev'
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          NAMESPACE: ${{ env.DEPLOY_NAMESPACE }}
          RELEASE_GATE_SAMPLES: ${{ inputs.release_gate_samples_path }}
          PROMETHEUS_URL: ${{ secrets.DMH_PROMETHEUS_URL }}
          PROMETHEUS_BEARER_TOKEN: ${{ secrets.DMH_PROMETHEUS_BEARER_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -n "$PROMETHEUS_URL" ]]; then
            test -n "${RELEASE_GATE_BASELINE:-}"
            observation_seconds="${RELEASE_GATE_OBSERVATION_SECONDS:-900}"
            [[ "$observation_seconds" =~ ^[0-9]+$ && "$observation_seconds" -ge 900 ]] || {
              echo 'RELEASE_GATE_OBSERVATION_SECONDS must be at least 900 seconds' >&2
              exit 2
            }
            sleep "$observation_seconds"
            python3 ci/scripts/collect-release-gates.py \
              --url "$PROMETHEUS_URL" \
              --namespace "$NAMESPACE" \
              --environment "$ENVIRONMENT" \
              --source-sha "${{ inputs.source_sha }}" \
              --manifest-digest "${{ inputs.manifest_digest }}" \
              --synthetic-status passed \
              --baseline-file "$RELEASE_GATE_BASELINE" \
              --output release-gates.raw.json
            python3 ci/scripts/normalize-release-gates.py release-gates.raw.json release-gates.json
            python3 ci/scripts/release-gates.py release-gates.json \
              --environment "$ENVIRONMENT" \
              --source-sha "${{ inputs.source_sha }}" \
              --manifest-digest "${{ inputs.manifest_digest }}"
          else
            test -n "$RELEASE_GATE_SAMPLES" && test -f "$RELEASE_GATE_SAMPLES"
            python3 ci/scripts/normalize-release-gates.py "$RELEASE_GATE_SAMPLES" release-gates.json
            python3 ci/scripts/release-gates.py release-gates.json \
              --environment "$ENVIRONMENT" \
              --source-sha "${{ inputs.source_sha }}" \
              --manifest-digest "${{ inputs.manifest_digest }}"
          fi
      - name: Roll back application and Nacos group after failed rollout
        if: failure()
        env:
          NAMESPACE: ${{ env.DEPLOY_NAMESPACE }}
        run: |
          set -euo pipefail
          if [[ "${helm_upgrade_started:-false}" != true || -z "${previous_revision:-}" || "${previous_revision:-none}" == none ]]; then
            echo 'rollback_attempted=false' >> "$GITHUB_ENV"
            echo 'failure happened before a reversible Helm upgrade; no automatic application rollback was attempted'
            exit 0
          fi
          echo "rolling back Helm revision $previous_revision; database changes are never reversed automatically"
          echo 'rollback_attempted=true' >> "$GITHUB_ENV"
          helm rollback data-manager-hub "$previous_revision" -n "$NAMESPACE" --wait --timeout 20m
          bash ci/scripts/access-rollout.sh
      - name: Publish failed GitHub Deployment status
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ENVIRONMENT: ${{ inputs.environment }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          deployment_id="$(gh api "repos/${GITHUB_REPOSITORY}/deployments" \
            -f ref="$SOURCE_SHA" -f environment="$ENVIRONMENT" \
            -f description="data-manager-hub ${ENVIRONMENT} deployment failed" \
            -f auto_merge=false --jq .id)"
          gh api "repos/${GITHUB_REPOSITORY}/deployments/${deployment_id}/statuses" \
            -f state=failure -f description="deployment failed; inspect receipt and rollback logs" \
            -f environment="$ENVIRONMENT" >/dev/null
      - name: Write failed deployment receipt
        if: failure()
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          MANIFEST: ${{ inputs.manifest_digest }}
          NAMESPACE: ${{ env.DEPLOY_NAMESPACE }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          migration_mode=UNKNOWN
          if [[ -s release-manifest/build-manifest.v1.json ]]; then
            migration_mode="$(jq -r '.spec.migration.mode // "UNKNOWN"' release-manifest/build-manifest.v1.json)"
          fi
          jq -n \
            --arg environment "$ENVIRONMENT" \
            --arg manifest "$MANIFEST" \
            --arg namespace "$NAMESPACE" \
            --arg sha "$SOURCE_SHA" \
            --arg previous "${previous_revision:-none}" \
            --arg rollback "${rollback_attempted:-false}" \
            --arg migration "$migration_mode" \
            '{apiVersion:"cicd.data-manager-hub/v1",kind:"DeploymentReceipt",status:"failure",environment:$environment,gitSha:$sha,buildManifest:$manifest,namespace:$namespace,helm:{previousRevision:$previous},migration:{mode:$migration},failure:{rollbackAttempted:($rollback == "true")},recordedAt:(now|todate)}' \
            > deployment-receipt-failure.json
      - name: Upload failed deployment receipt
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: deployment-failure-receipt-${{ inputs.environment }}-${{ github.run_id }}
          path: deployment-receipt-failure.json
      - name: Write deployment receipt
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          MANIFEST: ${{ inputs.manifest_digest }}
          NAMESPACE: ${{ env.DEPLOY_NAMESPACE }}
          SNAPSHOT_RECEIPT: ${{ inputs.environment == 'production' && inputs.snapshot_receipt_path || '' }}
        run: |
          set -euo pipefail
          migration_mode=UNKNOWN
          if [[ -s release-manifest/build-manifest.v1.json ]]; then
            migration_mode="$(jq -r '.spec.migration.mode // "UNKNOWN"' release-manifest/build-manifest.v1.json)"
          fi
          snapshot_id=''
          snapshot_digest=''
          if [[ -n "${SNAPSHOT_RECEIPT_PATH:-}" && -f "$SNAPSHOT_RECEIPT_PATH" ]]; then
            snapshot_id="$(jq -r '.snapshotId' "$SNAPSHOT_RECEIPT_PATH")"
            snapshot_digest="sha256:$(sha256sum "$SNAPSHOT_RECEIPT_PATH" | awk '{print $1}')"
          elif [[ -n "$SNAPSHOT_RECEIPT" && -f "$SNAPSHOT_RECEIPT" ]]; then
            snapshot_id="$(jq -r '.snapshotId' "$SNAPSHOT_RECEIPT")"
            snapshot_digest="sha256:$(sha256sum "$SNAPSHOT_RECEIPT" | awk '{print $1}')"
          fi
          current_revision="$(helm history data-manager-hub -n "$NAMESPACE" -o json | jq -r 'map(select(.status == "deployed"))[ -1].revision // "unknown"')"
          gates='null'
          if [[ -f release-gates.json ]]; then
            gates="$(cat release-gates.json)"
          elif [[ -n "$SNAPSHOT_RECEIPT" && -f "$SNAPSHOT_RECEIPT" ]]; then
            gates='null'
          fi
          jq -n \
            --arg environment "$ENVIRONMENT" \
            --arg manifest "$MANIFEST" \
            --arg sha "${{ inputs.source_sha }}" \
            --arg version "${{ inputs.release_version }}" \
            --arg previous "${previous_revision:-none}" \
            --arg current "$current_revision" \
            --arg snapshot "$snapshot_id" \
            --arg snapshotDigest "$snapshot_digest" \
            --arg nacos "DMH_${{ inputs.environment == 'production' && 'PROD' || inputs.environment == 'staging' && 'STAGING' || 'DEV' }}_${{ inputs.source_sha }}" \
            --arg migration "$migration_mode" \
            --argjson gates "$gates" \
            '{apiVersion:"cicd.data-manager-hub/v1",kind:"DeploymentReceipt",environment:$environment,gitSha:$sha,buildManifest:$manifest,releaseVersion:$version,helm:{release:"data-manager-hub",previousRevision:$previous,currentRevision:$current},nacos:{group:$nacos},migration:{mode:$migration},snapshotId:(if $snapshot == "" then null else $snapshot end),snapshotReceiptDigest:(if $snapshotDigest == "" then null else $snapshotDigest end),releaseGates:$gates,verifiedAt:(now|todate)}' \
            > deployment-receipt.json
      - name: Publish GitHub Deployment status
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ENVIRONMENT: ${{ inputs.environment }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          payload="$(cat deployment-receipt.json)"
          deployment_id="$(gh api "repos/${GITHUB_REPOSITORY}/deployments" \
            -f ref="$SOURCE_SHA" -f environment="$ENVIRONMENT" \
            -f description="data-manager-hub ${ENVIRONMENT} deployment" \
            -f payload="$payload" -f auto_merge=false --jq .id)"
          gh api "repos/${GITHUB_REPOSITORY}/deployments/${deployment_id}/statuses" \
            -f state=success -f description="deployment verified" \
            -f environment="$ENVIRONMENT" >/dev/null
      - name: Upload deployment receipt
        if: always() && hashFiles('deployment-receipt.json') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: deployment-receipt-${{ inputs.environment }}-${{ github.run_id }}
          path: deployment-receipt.json
          if-no-files-found: error
      - name: Upload verified production snapshot receipt
        if: always() && inputs.environment == 'production' && hashFiles('snapshot-receipt.json') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: snapshot-receipt-${{ inputs.environment }}-${{ github.run_id }}
          path: snapshot-receipt.json
          if-no-files-found: error
