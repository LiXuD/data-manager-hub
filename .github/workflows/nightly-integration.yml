name: Nightly Integration

on:
  schedule:
    - cron: '0 18 * * *'            # 每日 02:00 北京（UTC 18:00），按团队时区调整
  workflow_dispatch:

concurrency:
  group: nightly-integration
  cancel-in-progress: false

jobs:
  integration:
    runs-on: ubuntu-latest-large    # W5：7GB+，避免 OOM；免费版可能不可用，需验证 / 自托管
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Start middleware
        run: docker compose up -d postgres redis kafka nacos
      - name: Seed & init (N7)
        run: ./init-docker.sh         # 仓库已存在：flyway 迁移 + 初始数据（含 TEST_USER）
      - name: Start services + gateway
        run: ./start-services.sh      # 仓库已存在；启动 5 微服务 + Gateway
      - name: Wait for gateway
        run: |
          for i in $(seq 1 60); do
            curl -sf http://localhost:8888/actuator/health && break
            sleep 5
          done
      - name: Run integration tests
        env:
          TEST_USERNAME: ${{ secrets.TEST_USERNAME }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
          GATEWAY_URL: http://localhost:8888
        run: mvn -B -ntp -pl data-platform-test -am -Pintegration-tests verify
      - name: Tear down
        if: always()
        run: docker compose down -v
