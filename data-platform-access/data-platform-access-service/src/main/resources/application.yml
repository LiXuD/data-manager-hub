server:
  port: 8082

spring:
  profiles:
    active: @profiles.active@
  application:
    name: data-platform-access

flowable:
  database-schema-update: false
  history-level: audit
  check-process-definitions: true
  async-executor-activate: false
  idm:
    enabled: false
  eventregistry:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %highlight(%-5level) [%thread] %cyan(%logger{36}) [%X{traceId}] - %msg%n"
