spring:
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest

spring.data.redis:
  host: ${REDIS_HOST:localhost}
  port: ${REDIS_PORT:6379}
  password: ${REDIS_PASSWORD:redis_password}
  database: 0

sa-token:
  token-name: Authorization
  timeout: 7200
  is-concurrent: true
  is-share: false
  token-style: uuid
  token-prefix: Bearer

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.dataplatform.access.caller.entity,com.dataplatform.common.entity
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: true
      logic-not-delete-value: false

platform.security.internal:
  enabled: ${INTERNAL_AUTH_ENABLED:true}
  issuer: data-platform-identity
  service-name: data-platform-access
  token-uri: ${INTERNAL_AUTH_TOKEN_URI:http://localhost:8086/internal-auth/v1/token}
  client-secret: ${INTERNAL_AUTH_ACCESS_SECRET:dev-access-internal-secret}
  public-key-location: file:${INTERNAL_AUTH_PUBLIC_KEY_PATH:/run/secrets/dmh/internal-auth/public.pem}

platform.openapi:
  public-base-url: ${OPENAPI_PUBLIC_BASE_URL:http://localhost:8888}

connector.runtime:
  instance-id: ${CONNECTOR_INSTANCE_ID:${spring.application.name}:${server.port}}
  host-version: ${CONNECTOR_HOST_VERSION:1.0.0}
  cache-directory: ${CONNECTOR_PLUGIN_CACHE_DIR:__PROJECT_ROOT__/.runtime/plugins}
  repository-allowed-prefixes:
    - ${CONNECTOR_ARTIFACT_REPOSITORY_PREFIX:https://plugins.example.invalid/repository/data-platform}
  network-allowed-protocols: [https]
  network-allowed-hosts:
    - ${CONNECTOR_VENDOR_ALLOWED_HOST:api.example.invalid}
  allow-private-networks: ${CONNECTOR_ALLOW_PRIVATE_NETWORKS:false}
  max-connect-timeout-ms: 5000
  max-read-timeout-ms: 30000
  max-total-timeout-ms: 60000
  test-timeout-ms: 30000
  max-response-bytes: 10485760
  signing-keys:
    platform-default:
      resource: ${CONNECTOR_SIGNING_PUBLIC_KEY_RESOURCE:}
      algorithm: Ed25519

server.port: 8082
flowable.database-schema-update: false
flowable.history-level: audit
flowable.check-process-definitions: true
flowable.async-executor-activate: false
flowable.idm.enabled: false
flowable.eventregistry.enabled: false
management.endpoints.web.exposure.include: health,info,prometheus
management.endpoint.health.probes.enabled: true
management.endpoint.health.show-details: never
management.endpoint.health.group.liveness.include: livenessState,ping
management.endpoint.health.group.readiness.include: readinessState,connectorRuntimeReadiness
logging.pattern.console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %highlight(%-5level) [%thread] %cyan(%logger{36}) [%X{traceId}] - %msg%n"
