spring.data.redis:
  host: ${REDIS_HOST:localhost}
  port: ${REDIS_PORT:6379}
  password: ${REDIS_PASSWORD:redis_password}
  database: 0

sa-token:
  token-name: Authorization
  timeout: 7200
  is-concurrent: true
  is-share: false
  token-style: uuid
  token-prefix: Bearer

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.dataplatform.governance.monitor.entity,com.dataplatform.governance.log.entity,com.dataplatform.governance.quality.entity,com.dataplatform.governance.trace.entity
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: true
      logic-not-delete-value: false

platform.security.internal:
  enabled: ${INTERNAL_AUTH_ENABLED:true}
  issuer: data-platform-identity
  service-name: data-platform-governance
  token-uri: ${INTERNAL_AUTH_TOKEN_URI:http://localhost:8086/internal-auth/v1/token}
  client-secret: ${INTERNAL_AUTH_GOVERNANCE_SECRET:dev-governance-internal-secret}
  public-key-location: file:__PROJECT_ROOT__/.runtime/internal-auth-public.pem

server.port: 8085
management.endpoints.web.exposure.include: health,info,prometheus
logging.pattern.console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %highlight(%-5level) [%thread] %cyan(%logger{36}) [%X{traceId}] - %msg%n"
