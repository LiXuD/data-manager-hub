spring.data.redis:
  host: ${REDIS_HOST}
  port: ${REDIS_PORT}
  password: ${REDIS_PASSWORD}
  database: 0

sa-token:
  token-name: Authorization
  timeout: 7200
  is-concurrent: true
  is-share: false
  token-style: uuid
  token-prefix: Bearer

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  mapper-locations: classpath*:mapper/*.xml
  type-aliases-package: com.dataplatform.masterdata.vendor.entity,com.dataplatform.masterdata.interface_.entity,com.dataplatform.masterdata.graylog.entity
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: true
      logic-not-delete-value: false

platform.security.internal:
  enabled: true
  issuer: data-platform-identity
  service-name: data-platform-masterdata
  token-uri: ${INTERNAL_AUTH_TOKEN_URI}
  client-secret: ${INTERNAL_AUTH_MASTERDATA_SECRET}
  public-key-location: file:${INTERNAL_AUTH_PUBLIC_KEY_PATH}

spring.datasource.hikari.maximum-pool-size: 5

server.port: 8081
management.endpoints.web.exposure.include: health,info,prometheus
masterdata.vendor-config.cache-ttl-seconds: 300
logging.pattern.console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %highlight(%-5level) [%thread] %cyan(%logger{36}) [%X{traceId}] - %msg%n"
