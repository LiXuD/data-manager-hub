spring.data.redis:
  host: ${REDIS_HOST}
  port: ${REDIS_PORT}
  password: ${REDIS_PASSWORD}
  database: 0

sa-token:
  token-name: Authorization
  timeout: 7200
  is-concurrent: true
  is-share: false
  token-style: uuid
  token-prefix: Bearer

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  mapper-locations: classpath*:mapper/*.xml
  type-aliases-package: com.dataplatform.masterdata.vendor.entity,com.dataplatform.masterdata.interface_.entity,com.dataplatform.masterdata.graylog.entity
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: true
      logic-not-delete-value: false

platform.security.internal:
  enabled: true
  issuer: data-platform-identity
  service-name: data-platform-masterdata
  token-uri: ${INTERNAL_AUTH_TOKEN_URI}
  client-secret: ${INTERNAL_AUTH_MASTERDATA_SECRET}
  public-key-location: file:${INTERNAL_AUTH_PUBLIC_KEY_PATH:/run/secrets/dmh/internal-auth/public.pem}

spring.datasource.hikari.maximum-pool-size: 5

server.port: 8081
management.endpoint.health.probes.enabled: true
management.endpoint.health.show-details: never
management.endpoint.health.group.liveness.include: livenessState,ping
management.endpoint.health.group.readiness.include: readinessState,ping
management.endpoints.web.exposure.include: health,info,prometheus
masterdata.vendor-config.cache-ttl-seconds: 300
masterdata.connector-plugin:
  artifact-allowed-hosts:
    - ${CONNECTOR_ARTIFACT_REPOSITORY_HOST}
  artifact-allowed-path-prefixes:
    - ${CONNECTOR_ARTIFACT_REPOSITORY_PATH}
  trusted-signing-keys:
    platform-default: ${CONNECTOR_SIGNING_PUBLIC_KEY_BASE64}
  max-artifact-bytes: ${CONNECTOR_MAX_ARTIFACT_BYTES:52428800}
  max-manifest-bytes: ${CONNECTOR_MAX_MANIFEST_BYTES:262144}
  max-schema-bytes: ${CONNECTOR_MAX_SCHEMA_BYTES:131072}
  legacy-write-retired: ${CONNECTOR_LEGACY_WRITE_RETIRED:false}
logging.pattern.console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %highlight(%-5level) [%thread] %cyan(%logger{36}) [%X{traceId}] - %msg%n"
